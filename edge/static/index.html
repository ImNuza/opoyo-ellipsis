<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPOYO</title>
  <link rel="icon" href="/static/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/tokens.css">
  <style>
    html, body { overflow-x: clip; }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-md);
      line-height: 1.45;
    }
    ::selection { background: var(--color-navy); color: var(--color-resist); }
    :focus-visible {
      outline: 3px solid var(--color-focus);
      outline-offset: 3px;
    }
    .shell {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header.mast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: 14px var(--space-8);
      background-color: var(--color-header);
      background-image:
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--color-header) 58%, transparent),
          color-mix(in srgb, var(--color-header) 78%, transparent)
        ),
        var(--header-batik);
      background-size: cover;
      background-position: center 38%;
      color: var(--color-on-header);
      border-bottom: var(--rule) solid color-mix(in srgb, var(--color-tan) 55%, transparent);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }
    .brand img { width: 40px; height: 40px; flex: none; }
    .wordmark {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .wordmark strong {
      font-family: var(--font-display);
      font-style: normal;
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: 0.18em;
      line-height: 1;
    }
    .wordmark span {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--color-tan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    button, .btn {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--color-ink);
      background: var(--color-resist);
      border: var(--rule) solid var(--color-ink);
      border-radius: var(--radius);
      padding: 10px 14px;
      min-height: 44px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background var(--dur) var(--ease-out), color var(--dur) var(--ease-out);
    }
    header.mast button, header.mast .btn {
      color: var(--color-on-header);
      background: transparent;
      border-color: color-mix(in srgb, var(--color-on-header) 45%, transparent);
    }
    button:hover, .btn:hover { background: var(--color-wax); }
    header.mast button:hover, header.mast .btn:hover {
      background: color-mix(in srgb, var(--color-on-header) 12%, transparent);
    }
    button:active, .btn:active { transform: translateY(1px); }
    button[aria-pressed="true"] {
      background: var(--color-tan);
      color: var(--color-navy);
      border-color: var(--color-tan);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    main { padding: var(--space-6) var(--space-8) var(--space-8); min-width: 0; }
    h2 {
      margin: 0 0 var(--space-3);
      font-family: var(--font-display);
      font-style: normal;
      font-weight: 600;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }
    .note { color: var(--color-muted); font-size: var(--text-sm); margin: 0 0 var(--space-4); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      gap: var(--space-6);
      align-items: stretch;
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
      min-width: 0;
    }
    .rail {
      min-height: 0;
      height: 100%;
    }
    .rail .log-block {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    figure { margin: 0; min-width: 0; display: flex; flex-direction: column; }
    figcaption {
      font-size: var(--text-xs);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: var(--space-2);
    }
    .chart-wrap {
      position: relative;
      background: var(--color-resist);
      border: var(--rule) solid var(--color-line);
      min-height: 168px;
    }
    canvas { width: 100%; height: 168px; display: block; }
    .idline {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--color-muted);
      overflow-wrap: anywhere;
      margin: 0 0 var(--space-3);
    }
    .chip {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-wait);
    }
    .chip[data-live="true"] { color: var(--color-live); }
    .phone-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .phone-head h2 { margin: 0; }
    footer {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-8);
      border-top: var(--rule) solid var(--color-line);
      color: var(--color-muted);
      font-size: var(--text-sm);
    }
    footer p { margin: 0; }
    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin: 0 0 var(--space-5);
      padding: 12px 16px;
      border: var(--rule) solid var(--color-line);
      background: var(--color-resist);
      min-height: 56px;
    }
    .banner strong {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .banner[data-state="fall"] {
      background: var(--color-navy);
      color: var(--color-tan);
      border-color: var(--color-tan);
    }
    .log-scroll {
      flex: 1;
      min-height: 16rem;
      overflow: auto;
      border: var(--rule) solid var(--color-line);
      background: var(--color-resist);
    }
    table.log {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      margin: 0;
    }
    table.log th, table.log td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: var(--rule) solid var(--color-line);
    }
    table.log thead th {
      position: sticky;
      top: 0;
      background: var(--color-resist);
      z-index: 1;
    }
    table.log tr.is-fall td { color: var(--color-navy); font-weight: 600; }
    .detail-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-3);
      margin: 0;
    }
    .detail-meta div {
      background: var(--color-resist);
      border: var(--rule) solid var(--color-line);
      padding: 12px;
    }
    .detail-meta dt {
      font-size: var(--text-xs);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .detail-meta dd {
      margin: 4px 0 0;
      font-family: var(--font-mono);
      font-size: var(--text-xl);
    }
    .phone-model {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.05rem;
    }
    .phone-panel.empty { opacity: 0.7; }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .log-scroll { min-height: 22rem; max-height: 34.5rem; }
      .detail-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 768px) {
      header.mast, main, footer { padding-left: var(--space-4); padding-right: var(--space-4); }
      .wordmark strong { font-size: 1.2rem; overflow-wrap: anywhere; min-width: 0; }
      .detail-meta { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      button, .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="mast">
      <a class="brand" href="#/">
        <img src="/static/logo.png" alt="">
        <div class="wordmark">
          <strong>OPOYO</strong>
          <span>Observe · Predict · On Your Own</span>
        </div>
      </a>
      <div class="actions">
        <button type="button" id="pause" aria-pressed="false">Pause</button>
      </div>
    </header>

    <main>
      <div class="banner" id="banner" data-state="quiet">
        <strong id="bannerText">No inference yet</strong>
      </div>
      <div class="layout">
        <section class="stack phone-panel" id="phonePanel" aria-label="Live readings">
          <h2>Live Readings</h2>
          <div class="phone-head">
            <p class="phone-model" id="phoneTitle">Waiting for phone</p>
            <div class="chip" id="phoneLive" data-live="false">Waiting</div>
          </div>
          <p class="idline" id="phoneId">Empty slot</p>
          <div class="detail-meta">
            <div><dt>Magnitude</dt><dd id="pMag">-</dd></div>
            <div><dt>Sound</dt><dd id="pDb">-</dd></div>
            <div><dt>Rate</dt><dd id="pHz">-</dd></div>
            <div><dt>Packets</dt><dd id="pN">-</dd></div>
          </div>
          <figure>
            <figcaption>Magnitude (g)</figcaption>
            <div class="chart-wrap"><canvas id="comboMag" width="900" height="220" aria-label="Magnitude"></canvas></div>
          </figure>
          <figure>
            <figcaption>Sound (dB)</figcaption>
            <div class="chart-wrap"><canvas id="comboDb" width="900" height="220" aria-label="Sound"></canvas></div>
          </figure>
          <figure>
            <figcaption>Frequency (Hz)</figcaption>
            <div class="chart-wrap"><canvas id="comboFreq" width="900" height="220" aria-label="Frequency spectrum"></canvas></div>
          </figure>
          <figure>
            <figcaption>ax (g)</figcaption>
            <div class="chart-wrap"><canvas id="cAx" width="900" height="220" aria-label="ax"></canvas></div>
          </figure>
          <figure>
            <figcaption>ay (g)</figcaption>
            <div class="chart-wrap"><canvas id="cAy" width="900" height="220" aria-label="ay"></canvas></div>
          </figure>
          <figure>
            <figcaption>az (g)</figcaption>
            <div class="chart-wrap"><canvas id="cAz" width="900" height="220" aria-label="az"></canvas></div>
          </figure>
        </section>

        <section class="stack rail" aria-label="Live inference">
          <div class="log-block">
            <h2>Live Inference</h2>
            <p class="note" id="comboNote">Newest 15 rows in view. Scroll for the rest.</p>
            <div class="log-scroll" id="inferScroll">
              <table class="log" id="inferLog">
                <thead>
                  <tr><th>timestamp</th><th>room</th><th>fall or no fall</th><th>confidence</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- <footer>
      <p>Phone is a proxy. Product is a floor puck.</p>
      <p id="foot">Edge stub CNN. Cloud only on gated falls.</p>
    </footer> -->
  </div>
  <script>
    const MAX = 220;
    const PAD = { l: 44, r: 10, t: 10, b: 22 };
    const SAMPLE_HZ = 50;
    const LOG_VIEW = 15;
    const comboMagBuf = [];
    const comboDbBuf = [];
    const nodes = {};
    let slots = [];
    let paused = false;
    let dropped = 0;
    let combined = { mag: 0, db: -120, live: 0, hz: 0, packets: 0 };
    let inference = { latest: null, log: [], cfg: { escalate_min_confidence: 0.9 } };

    const pauseBtn = document.getElementById("pause");
    const comboNote = document.getElementById("comboNote");
    const bannerEl = document.getElementById("banner");
    const bannerText = document.getElementById("bannerText");
    const inferLogBody = document.querySelector("#inferLog tbody");
    const phonePanel = document.getElementById("phonePanel");

    function ink() {
      return getComputedStyle(document.body).getPropertyValue("--color-navy").trim() || "#1e3a5f";
    }
    function teal() {
      return getComputedStyle(document.body).getPropertyValue("--color-teal").trim() || "#3d7a7a";
    }
    function tan() {
      return getComputedStyle(document.body).getPropertyValue("--color-tan").trim() || "#c4a574";
    }
    function muted() {
      return getComputedStyle(document.body).getPropertyValue("--color-muted").trim() || "#5c6b7a";
    }
    function line() {
      return getComputedStyle(document.body).getPropertyValue("--color-line").trim() || "#d8d0c4";
    }

    pauseBtn.addEventListener("click", () => {
      paused = !paused;
      pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
      pauseBtn.textContent = paused ? "Resume" : "Pause";
    });

    function fmt(n, digits) {
      return typeof n === "number" && isFinite(n) ? n.toFixed(digits) : "-";
    }
    function pushBuf(buf, v) {
      buf.push(v);
      while (buf.length > MAX) buf.shift();
    }
    function ensure(id) {
      if (!nodes[id]) {
        nodes[id] = { ax: [], ay: [], az: [], mag: [], db: [], meta: {} };
      }
      return nodes[id];
    }
    function phone1() {
      return slots.find((s) => s && !s.empty && s.slot === 1)
        || slots.find((s) => s && !s.empty)
        || null;
    }

    function draw(canvas, values, min, max, stroke, unit) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const innerW = w - PAD.l - PAD.r;
      const innerH = h - PAD.t - PAD.b;
      ctx.strokeStyle = line();
      ctx.lineWidth = 1;
      ctx.fillStyle = muted();
      ctx.font = "11px ui-monospace, SF Mono, Menlo, monospace";
      const ticks = 4;
      for (let i = 0; i <= ticks; i++) {
        const frac = i / ticks;
        const y = PAD.t + innerH * (1 - frac);
        const val = min + (max - min) * frac;
        ctx.beginPath();
        ctx.moveTo(PAD.l, y);
        ctx.lineTo(w - PAD.r, y);
        ctx.stroke();
        ctx.fillText(val.toFixed(unit === "dB" ? 0 : 2), 4, y + 3);
      }
      ctx.fillText(unit, 4, h - 6);
      if (values.length < 2) return;
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = PAD.l + (i / (MAX - 1)) * innerW;
        const y = PAD.t + innerH - ((v - min) / (max - min || 1)) * innerH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }

    function spectrum(buf, hz) {
      const nWant = 128;
      if (!buf.length || buf.length < 16) return { spec: [], freqs: [] };
      const slice = buf.slice(-Math.min(buf.length, nWant));
      const n = slice.length;
      let mean = 0;
      for (let i = 0; i < n; i++) mean += slice[i];
      mean /= n;
      const half = Math.floor(n / 2);
      const spec = [];
      const freqs = [];
      for (let k = 0; k <= half; k++) {
        let re = 0;
        let im = 0;
        for (let i = 0; i < n; i++) {
          const ang = (-2 * Math.PI * k * i) / n;
          const v = slice[i] - mean;
          re += v * Math.cos(ang);
          im += v * Math.sin(ang);
        }
        spec.push(Math.hypot(re, im) / n);
        freqs.push((k * hz) / n);
      }
      return { spec, freqs };
    }

    function drawSpectrum(canvas, spec, freqs) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      const innerW = w - PAD.l - PAD.r;
      const innerH = h - PAD.t - PAD.b;
      const max = Math.max(0.001, ...spec, 0.001);
      ctx.strokeStyle = line();
      ctx.lineWidth = 1;
      ctx.fillStyle = muted();
      ctx.font = "11px ui-monospace, SF Mono, Menlo, monospace";
      const ticks = 4;
      for (let i = 0; i <= ticks; i++) {
        const frac = i / ticks;
        const y = PAD.t + innerH * (1 - frac);
        ctx.beginPath();
        ctx.moveTo(PAD.l, y);
        ctx.lineTo(w - PAD.r, y);
        ctx.stroke();
        ctx.fillText((max * frac).toFixed(3), 4, y + 3);
      }
      const fMax = freqs.length ? freqs[freqs.length - 1] : SAMPLE_HZ / 2;
      ctx.fillText("0", PAD.l, h - 6);
      ctx.fillText(fMax.toFixed(0) + " Hz", w - PAD.r - 48, h - 6);
      if (spec.length < 2) return;
      ctx.beginPath();
      spec.forEach((v, i) => {
        const x = PAD.l + (i / (spec.length - 1)) * innerW;
        const y = PAD.t + innerH - (v / max) * innerH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = teal();
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }

    function magScale(buf) {
      return Math.max(0.4, ...buf, 0.4);
    }

    function drawFloor() {
      const buf = phone1Buf();
      const mag = buf && buf.mag.length ? buf.mag : comboMagBuf;
      const db = buf && buf.db.length ? buf.db : comboDbBuf;
      draw(document.getElementById("comboMag"), mag, 0, magScale(mag), ink(), "g");
      draw(document.getElementById("comboDb"), db, -80, 0, tan(), "dB");
      const { spec, freqs } = spectrum(mag, SAMPLE_HZ);
      drawSpectrum(document.getElementById("comboFreq"), spec, freqs);
    }

    function phone1Buf() {
      const slot = phone1();
      if (!slot || !slot.id) return null;
      return ensure(slot.id);
    }

    function renderPhone1() {
      const slot = phone1();
      const buf = slot && slot.id ? ensure(slot.id) : { ax: [], ay: [], az: [], mag: [], db: [], meta: {} };
      if (!slot) {
        phonePanel.classList.add("empty");
        document.getElementById("phoneTitle").textContent = "Waiting for phone";
        document.getElementById("phoneLive").textContent = "Waiting";
        document.getElementById("phoneLive").setAttribute("data-live", "false");
        document.getElementById("phoneId").textContent = "Empty slot";
        document.getElementById("pMag").textContent = "-";
        document.getElementById("pDb").textContent = "-";
        document.getElementById("pHz").textContent = "-";
        document.getElementById("pN").textContent = "-";
        draw(document.getElementById("cAx"), [], -0.4, 0.4, ink(), "g");
        draw(document.getElementById("cAy"), [], -0.4, 0.4, teal(), "g");
        draw(document.getElementById("cAz"), [], -0.4, 0.4, tan(), "g");
        return;
      }
      phonePanel.classList.remove("empty");
      const model = slot.model || buf.meta.model || "iPhone";
      const short = slot.short || buf.meta.short || "";
      const from = slot.from || buf.meta.from || "";
      const name = slot.name || "Phone 1";
      document.getElementById("phoneTitle").textContent = model;
      document.getElementById("phoneLive").textContent = slot.live ? "Live" : "Waiting";
      document.getElementById("phoneLive").setAttribute("data-live", slot.live ? "true" : "false");
      document.getElementById("phoneId").textContent = name + (short ? " · " + short : "") + (from ? " · " + from : "");
      document.getElementById("pMag").textContent = fmt(slot.mag, 3) + " g";
      document.getElementById("pDb").textContent = fmt(slot.db, 1) + " dB";
      document.getElementById("pHz").textContent = fmt(slot.hz, 1) + " Hz";
      document.getElementById("pN").textContent = String(slot.packets || 0);
      const axMax = Math.max(0.4, ...buf.ax.map(Math.abs), 0.4);
      const ayMax = Math.max(0.4, ...buf.ay.map(Math.abs), 0.4);
      const azMax = Math.max(0.4, ...buf.az.map(Math.abs), 0.4);
      draw(document.getElementById("cAx"), buf.ax, -axMax, axMax, ink(), "g");
      draw(document.getElementById("cAy"), buf.ay, -ayMax, ayMax, teal(), "g");
      draw(document.getElementById("cAz"), buf.az, -azMax, azMax, tan(), "g");
    }

    function applyInference(d) {
      if (!d) return;
      inference = d;
      const latest = d.latest;
      if (latest && latest.is_fall) {
        bannerEl.setAttribute("data-state", "fall");
        bannerText.textContent = "Fall · " + Number(latest.confidence).toFixed(2);
      } else if (latest) {
        bannerEl.setAttribute("data-state", "quiet");
        bannerText.textContent = "No fall · " + Number(latest.confidence).toFixed(2);
      } else {
        bannerEl.setAttribute("data-state", "quiet");
        bannerText.textContent = "No inference yet";
      }
      const thresh = d.cfg && d.cfg.escalate_min_confidence;
      const rows = (d.log || []).slice().reverse();
      inferLogBody.innerHTML = "";
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        if (row.is_fall) tr.className = "is-fall";
        const when = row.timestamp ? new Date(row.timestamp).toISOString().replace("T", " ").slice(0, 19) : "-";
        tr.innerHTML = "<td>" + when + "</td><td>" + (row.room || "-") + "</td><td>" + (row.is_fall ? "fall" : "no fall") + "</td><td>" + Number(row.confidence).toFixed(2) + "</td>";
        inferLogBody.appendChild(tr);
      });
      const extra = Math.max(0, rows.length - LOG_VIEW);
      comboNote.textContent = rows.length
        ? (extra ? "Newest " + LOG_VIEW + " in view · " + extra + " older below." : rows.length + " recent windows.")
        : "No windows yet.";
    }

    function applyState(s) {
      if (!s) return;
      if (Array.isArray(s.slots)) slots = s.slots;
      if (s.combined) combined = s.combined;
      if (typeof s.dropped === "number") dropped = s.dropped;
      if (s.inference) applyInference(s.inference);
      if (s.histories) {
        Object.keys(s.histories).forEach((id) => {
          const buf = ensure(id);
          const rows = s.histories[id] || [];
          buf.ax = rows.map((r) => r.ax);
          buf.ay = rows.map((r) => r.ay);
          buf.az = rows.map((r) => r.az);
          buf.mag = rows.map((r) => r.mag);
          buf.db = rows.map((r) => r.db);
        });
      }
      if (Array.isArray(s.combined_history) && s.combined_history.length) {
        comboMagBuf.length = 0;
        comboDbBuf.length = 0;
        s.combined_history.forEach((r) => {
          comboMagBuf.push(r.mag);
          comboDbBuf.push(r.db);
        });
      }
      drawFloor();
      renderPhone1();
    }

    function onTick(p) {
      if (paused || !p || !p.id) return;
      const buf = ensure(p.id);
      buf.meta = { name: p.name, model: p.model, short: p.short, from: p.from };
      pushBuf(buf.ax, p.ax);
      pushBuf(buf.ay, p.ay);
      pushBuf(buf.az, p.az);
      pushBuf(buf.mag, p.mag);
      pushBuf(buf.db, typeof p.db === "number" ? p.db : -120);
      if (p.combined) {
        combined = p.combined;
        pushBuf(comboMagBuf, p.combined.mag);
        pushBuf(comboDbBuf, p.combined.db);
      }
      const existing = slots.find((s) => s && s.id === p.id);
      if (existing) {
        existing.live = true;
        existing.ax = p.ax;
        existing.ay = p.ay;
        existing.az = p.az;
        existing.mag = p.mag;
        existing.db = p.db;
        existing.hz = p.hz;
        existing.packets = p.packets;
        existing.name = p.name;
        existing.model = p.model;
        existing.short = p.short;
        existing.from = p.from;
      } else if (p.slot === 1 || !slots.some((s) => s && !s.empty)) {
        slots = [{
          slot: 1,
          empty: false,
          id: p.id,
          live: true,
          ax: p.ax,
          ay: p.ay,
          az: p.az,
          mag: p.mag,
          db: p.db,
          hz: p.hz,
          packets: p.packets,
          name: p.name || "Phone 1",
          model: p.model,
          short: p.short,
          from: p.from,
        }];
      }
      drawFloor();
      renderPhone1();
      if (p.inference) applyInference(p.inference);
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(proto + "://" + location.host + "/ws");
      ws.onmessage = (ev) => {
        let p;
        try { p = JSON.parse(ev.data); } catch (e) { return; }
        if (p && p.k === "state") applyState(p);
        else if (p && p.k === "tick") onTick(p);
        else if (p && p.k === "inference") applyInference(p);
        else if (p && p.slots) applyState(p);
      };
      ws.onclose = () => setTimeout(connect, 1000);
    }

    connect();

    setInterval(async () => {
      try {
        const r = await fetch("/api/state");
        const s = await r.json();
        applyState(s);
      } catch (e) {}
    }, 800);
  </script>
</body>
