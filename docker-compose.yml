name: opoyo

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    env_file:
      - .env
    environment:
      OPOYO_ROOT: /app
      OPOYO_CONFIG: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8001:8001"
    restart: unless-stopped

  edge:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
    env_file:
      - .env
    environment:
      # Service DNS name on the Compose network, not 127.0.0.1 from .env.
      CLOUD_URL: http://server:8001
      EDGE_ENABLE_UDP: "1"
      OPOYO_ROOT: /app
      OPOYO_CONFIG: /app/config.yaml
    ports:
      - "8000:8000"
      - "9000:9000/udp"
      - "9001:9001/udp"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - edge-data:/app/src/edge/data
    restart: unless-stopped

volumes:
  edge-data:
