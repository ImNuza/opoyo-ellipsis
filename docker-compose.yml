name: opoyo

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    env_file:
      - .env
    ports:
      - "8001:8001"
    restart: unless-stopped

  edge:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
    env_file:
      - .env
    environment:
      # Compose network name, not localhost from .env
      CLOUD_URL: http://server:8001
      EDGE_ENABLE_UDP: "1"
      OPOYO_ROOT: /app
    ports:
      - "8000:8000"
      - "9000:9000/udp"
      - "9001:9001/udp"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - edge-data:/app/src/edge/data
    restart: unless-stopped

volumes:
  edge-data:
